name: Check sources

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
          architecture: x64
      - run: python -m pip install -r requirements.txt unicorn==2.1.4
      - run: python -X utf8 -m unittest discover -s tests -v
      - run: python -X utf8 scripts/check_publication.py --index
