name: Build and publish official-version release

on:
  push:
    tags: ['v[0-9]*.[0-9]*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test and audit sources
        run: |
          python -X utf8 -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 scripts/check_publication.py --index
      - name: Build and verify the tool and localized portable ZIP
        run: python -X utf8 scripts/build_release.py --tag "$env:GITHUB_REF_NAME" --output dist/release
      - name: Publish both ZIP files and SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -X utf8 scripts/publish_release.py --tag "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" --assets dist/release --replace-assets
